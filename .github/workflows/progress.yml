name: Update DSA learning progress

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/scripts/update_progress.py"
      - ".github/workflows/progress.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Calculate checklist progress
        run: python .github/scripts/update_progress.py

      - name: Commit updated percentage
        run: |
          if git diff --quiet -- README.md; then
            echo "Progress is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update DSA learning progress"
          git push
